<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico — Cálculo Trabalhista</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo" style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
  <div>
    <h1>Histórico de cálculos</h1>
    <p>Cálculos salvos por todo o escritório</p>
  </div>
  <div style="font-size:0.85rem; text-align:right;">
    <div id="usuarioLogado">—</div>
    <a href="#" id="btnSair" style="color:#fff; text-decoration:underline; cursor:pointer;">Sair</a>
    · <a href="index.html" style="color:#fff; text-decoration:underline;">Novo cálculo</a>
    · <a href="admin.html" id="linkAdmin" style="display:none; color:#fff; text-decoration:underline;">Administração</a>
  </div>
</header>

<main>
  <section class="painel">
    <table class="resultado" id="tabelaHistorico">
      <thead>
        <tr><th>Data</th><th>Reclamante</th><th>Reclamado</th><th>Processo</th><th style="text-align:right;">Total</th><th>Calculado por</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="mensagemHistorico"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script>
  async function excluirCalculo(id, linha) {
    if (!confirm("Apagar este cálculo do histórico? Essa ação não pode ser desfeita.")) return;
    try {
      await firebaseDb.collection("calculos").doc(id).delete();
      linha.remove();
    } catch (erro) {
      alert("Não foi possível apagar: " + erro.message);
    }
  }

  exigirLogin(async (usuario) => {
    const corpo = document.querySelector("#tabelaHistorico tbody");
    const mensagem = document.getElementById("mensagemHistorico");
    const podeExcluir = ehAdmin(usuario);
    try {
      let consulta = firebaseDb.collection("calculos").orderBy("criadoEm", "desc").limit(100);
      if (!ehAdmin(usuario)) {
        const perfil = await obterMeuPerfil(usuario);
        if (!perfil || !perfil.escritorioId) {
          mensagem.innerHTML = '<div class="aviso">Sua conta ainda não foi associada a um escritório. Peça para o administrador te adicionar.</div>';
          return;
        }
        consulta = firebaseDb.collection("calculos").where("escritorioId", "==", perfil.escritorioId).orderBy("criadoEm", "desc").limit(100);
      }
      const snap = await consulta.get();
      if (snap.empty) {
        mensagem.textContent = "Nenhum cálculo salvo ainda.";
        return;
      }
      snap.forEach((doc) => {
        const c = doc.data();
        const data = c.criadoEm && c.criadoEm.toDate ? c.criadoEm.toDate().toLocaleString("pt-BR") : "-";
        const url = `visualizar.html?id=${doc.id}`;
        const linha = document.createElement("tr");
        linha.style.cursor = "pointer";
        linha.innerHTML = `
          <td><a href="${url}">${data}</a></td>
          <td><a href="${url}">${c.reclamante || "-"}</a></td>
          <td>${c.reclamado || "-"}</td>
          <td>${c.numeroProcesso || "-"}</td>
          <td class="valor">${formatarMoeda(c.total)}</td>
          <td>${c.criadoPor || "-"}</td>
          <td>${podeExcluir ? '<button class="btn-excluir" title="Apagar">🗑️</button>' : ""}</td>
        `;
        linha.addEventListener("click", (e) => {
          if (e.target.classList.contains("btn-excluir")) {
            e.stopPropagation();
            excluirCalculo(doc.id, linha);
            return;
          }
          if (e.target.tagName !== "A") window.location.href = url;
        });
        corpo.appendChild(linha);
      });
    } catch (erro) {
      mensagem.innerHTML = `<div class="erro">Não foi possível carregar o histórico: ${erro.message}</div>`;
    }
  });

  document.getElementById("btnSair").addEventListener("click", (e) => {
    e.preventDefault();
    sair();
  });
</script>
</body>
</html>
